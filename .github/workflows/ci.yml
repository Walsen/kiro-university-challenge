name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Default to read-only; the deploy job opts into id-token below for OIDC.
permissions:
  contents: read

jobs:
  build:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install infra dependencies
        working-directory: infra
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

  deploy:
    name: deploy → shared backend (cdk deploy)
    needs: build
    runs-on: ubuntu-latest
    # Deploy the single shared backend after the build job passes, from either environment
    # branch (main = prod, staging = staging — both serve the one shared backend). Pull
    # requests never deploy: they run build only.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')

    # OIDC: the workflow requests a short-lived token that AWS exchanges for temporary
    # role credentials. No long-lived AWS access keys are stored in GitHub secrets.
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Debug OIDC claims
        run: |
          payload=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | cut -d '.' -f2)
          # pad base64url and decode
          case $(( ${#payload} % 4 )) in 2) payload="$payload==";; 3) payload="$payload=";; esac
          echo "$payload" | tr '_-' '/+' | base64 -d 2>/dev/null | tr ',' '\n' | grep -E '"(sub|aud|repository|ref|workflow_ref)"' || echo "decode failed"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Single least-privilege deploy role provisioned in CDK (infra/), trusting this
          # repository's main and staging branches. Its ARN is the DeployRoleArn stack
          # output.
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-deploy-${{ github.run_id }}

      - name: Install infra dependencies
        working-directory: infra
        run: npm ci

      - name: Deploy shared backend stack
        working-directory: infra
        # Deploys the single shared backend stack. The assumed role may only assume the CDK
        # bootstrap roles, which perform the actual resource changes.
        run: npx cdk deploy MazeGamePlatform --require-approval never
