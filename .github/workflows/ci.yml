name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Default to read-only; the deploy job opts into id-token below for OIDC.
permissions:
  contents: read

jobs:
  build:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

  deploy-dev:
    name: deploy → dev (cdk deploy)
    needs: build
    runs-on: ubuntu-latest
    # Deploy only from the main branch after the build job passes. Pull requests never
    # deploy: they run build only. Promotion to prod is a separate, gated workflow.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # OIDC: the workflow requests a short-lived token that AWS exchanges for temporary
    # role credentials. No long-lived AWS access keys are stored in GitHub secrets.
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Least-privilege deploy role provisioned in CDK (infra/), trusting only this
          # repository's main branch. Its ARN is the DeployRoleArn stack output.
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN_DEV }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-deploy-dev-${{ github.run_id }}

      - name: Install infra dependencies
        working-directory: infra
        run: npm ci

      - name: Deploy dev stack
        working-directory: infra
        # Deploys the dev environment's stack. The assumed role may only assume the CDK
        # bootstrap roles, which perform the actual resource changes.
        run: npx cdk deploy MazeGamePlatform-dev --require-approval never
